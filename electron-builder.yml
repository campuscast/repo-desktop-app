appId: com.campuscast.player
productName: CampusCast Player
directories:
  buildResources: build
  output: builds
files:
  - out/**/*
  - "!out/renderer/**/*"
  - "!node_modules/**/*"
extraResources:
  - from: out/renderer/
    to: renderer/
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Utility
mac:
  target:
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
